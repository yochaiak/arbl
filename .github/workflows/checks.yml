name: Browser workspace checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: npm --prefix apps/verifier ci
      - run: make lint typecheck test build
      - run: make infra migrate
      - name: Exercise the local browser and data pipeline
        run: |
          uv run uvicorn --app-dir tests --factory browser_fixture:create_app --host 127.0.0.1 --port 8400 --no-proxy-headers --no-access-log > "${RUNNER_TEMP}/abrl-api.log" 2>&1 &
          make worker > "${RUNNER_TEMP}/abrl-worker.log" 2>&1 &
          make scheduler > "${RUNNER_TEMP}/abrl-scheduler.log" 2>&1 &
          make sessions > "${RUNNER_TEMP}/abrl-sessions.log" 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8400/health
          make integration-test
      - name: Stop test infrastructure
        if: always()
        run: make down
