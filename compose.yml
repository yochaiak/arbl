name: abrl
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: abrl
      POSTGRES_USER: abrl
      POSTGRES_PASSWORD: ${ABRL_DB_PASSWORD:?Run make configure first}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "abrl", "-d", "abrl"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${ABRL_REDIS_PASSWORD:?Run make configure first}"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${ABRL_REDIS_PASSWORD}", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_USER: abrl
      CLICKHOUSE_PASSWORD: ${ABRL_CLICKHOUSE_PASSWORD:?Run make configure first}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["127.0.0.1:58123:8123"]
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./infrastructure/clickhouse.sql:/docker-entrypoint-initdb.d/10-abrl.sql:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 4s
      timeout: 3s
      retries: 30
  artifacts:
    image: chrislusf/seaweedfs:4.53
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: abrl-artifacts
      AWS_SECRET_ACCESS_KEY: ${ABRL_ARTIFACT_PASSWORD:?Run make configure first}
      S3_BUCKET: abrl-reports
    ports: ["127.0.0.1:59000:8333"]
    volumes: ["artifacts:/data"]

volumes:
  postgres:
  redis:
  clickhouse:
  artifacts:
