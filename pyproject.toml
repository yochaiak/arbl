[project]
name = "abrl"
version = "0.1.0"
description = "Local browser workflow reliability lab"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.15,<2",
  "boto3>=1.44.1",
  "dramatiq[redis]>=1.18,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "opentelemetry-exporter-otlp-proto-http>=1.35,<2",
  "opentelemetry-instrumentation-fastapi<1",
  "opentelemetry-sdk>=1.35,<2",
  "playwright>=1.53,<2",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.4,<5",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires a running application and worker"]

[tool.ruff]
line-length = 108
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
