nodeSelector: {abrl.io/role: app}
operator: {replicaCount: 2}
metricsServer: {replicaCount: 2}
webhooks: {replicaCount: 2}
topologySpreadConstraints:
  operator:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector: {matchLabels: {app: keda-operator}}
  metricsServer:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector: {matchLabels: {app: keda-operator-metrics-apiserver}}
  webhooks:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector: {matchLabels: {app: keda-admission-webhooks}}
