{{- if .Values.application.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: abrl-migrate-{{ .Release.Revision }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {app: abrl-migrate, abrl.io/role: control}}
    spec:
      {{- include "abrl.applicationNode" . | nindent 6 }}
      restartPolicy: Never
      imagePullSecrets: {{ toJson $.Values.imagePullSecrets }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "abrl.podSecurity" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "abrl.image" .Values.image }}
          command: [python, /app/scripts/cloud-migrate.py]
          envFrom: [{secretRef: {name: {{ .Values.runtimeSecret }}}}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}

{{- end }}
