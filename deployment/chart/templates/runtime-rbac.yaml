{{- if .Values.cloudWorkers.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: abrl-session-controller}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: abrl-session-controller}
rules:
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: abrl-session-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: abrl-session-controller}
subjects: [{kind: ServiceAccount, name: abrl-session-controller, namespace: {{ .Release.Namespace }}}]
{{- end }}
