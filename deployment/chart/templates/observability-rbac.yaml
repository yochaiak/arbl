{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: abrl-observability}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: abrl-observability}
rules:
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/proxy, nodes/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: abrl-observability}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: abrl-observability}
subjects: [{kind: ServiceAccount, name: abrl-observability, namespace: {{ .Release.Namespace }}}]
{{- end }}
