{{- if .Values.backupMirror.enabled }}
{{- $jobs := list }}
{{- range $bucket := .Values.backupMirror.sourceBuckets }}
{{- $jobs = append $jobs (dict "bucket" $bucket "suffix" $bucket "native" false "prefix" "" "schedule" "*/5 * * * *" "deadline" 3600) }}
{{- end }}
{{- range $bucket := .Values.backupMirror.nativeSseBuckets }}
{{- $jobs = append $jobs (dict "bucket" $bucket "suffix" $bucket "native" true "prefix" $.Values.backupMirror.nativePrefix "schedule" "*/5 * * * *" "deadline" 3600) }}
{{- $jobs = append $jobs (dict "bucket" $bucket "suffix" (printf "wal-%s" $bucket) "native" true "prefix" $.Values.backupMirror.nativeWalPrefix "schedule" "* * * * *" "deadline" 600) }}
{{- end }}
{{- range $job := $jobs }}
apiVersion: batch/v1
kind: CronJob
metadata: {name: {{ printf "abrl-backup-%s" $job.suffix | trunc 52 | trimSuffix "-" }}}
spec:
  schedule: {{ $job.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ $job.deadline }}
      template:
        metadata: {labels: {app: abrl-backup, abrl.io/role: control}}
        spec:
          {{- include "abrl.applicationNode" $ | nindent 10 }}
          restartPolicy: Never
          imagePullSecrets: {{ toJson $.Values.imagePullSecrets }}
          automountServiceAccountToken: false
          securityContext:
            {{- include "abrl.podSecurity" $ | nindent 12 }}
          containers:
            - name: mirror
              image: {{ include "abrl.image" $.Values.image }}
              command: [python, /app/scripts/cloud-backup.py, mirror, --source-bucket, {{ $job.bucket | quote }}, --destination-bucket, {{ $.Values.backupMirror.destinationBucket | quote }}{{ if $job.native }}, --native-sse, --prefix, {{ $job.prefix | quote }}{{ end }}]
              envFrom: [{secretRef: {name: {{ $.Values.backupMirror.secret }}}}]
              resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
              volumeMounts: [{name: tmp, mountPath: /tmp}]
          volumes: [{name: tmp, emptyDir: {sizeLimit: 50Gi}}]
---
{{- end }}
{{- end }}
