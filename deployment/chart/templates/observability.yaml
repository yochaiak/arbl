{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata: {name: abrl-observability}
data:
  prometheus.yml: |
    global: {scrape_interval: 15s, evaluation_interval: 15s}
    rule_files: [/etc/prometheus/alerts.yml]
    scrape_configs:
      - job_name: abrl-fleet
        metrics_path: /api/v1/fleet/metrics
        authorization: {credentials_file: /etc/metrics/token}
        static_configs: [{targets: ['abrl-api:8400']}]
      - job_name: prometheus
        static_configs: [{targets: ['localhost:9090']}]
      - job_name: cnpg
        kubernetes_sd_configs: [{role: pod, namespaces: {names: [{{ .Release.Namespace | quote }}]}}]
        relabel_configs:
          - {source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster], action: keep, regex: abrl-postgres}
          - {source_labels: [__meta_kubernetes_pod_container_port_number], action: keep, regex: '9187'}
      - job_name: clickhouse
        kubernetes_sd_configs: [{role: pod, namespaces: {names: [{{ .Release.Namespace | quote }}]}}]
        relabel_configs:
          - {source_labels: [__meta_kubernetes_pod_label_app], action: keep, regex: abrl-clickhouse}
          - {source_labels: [__meta_kubernetes_pod_container_port_name], action: keep, regex: metrics}
      - job_name: kubernetes-cadvisor
        scheme: https
        authorization: {credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token}
        tls_config: {ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
        kubernetes_sd_configs: [{role: node}]
        relabel_configs:
          - {target_label: __address__, replacement: kubernetes.default.svc:443}
          - {source_labels: [__meta_kubernetes_node_name], target_label: __metrics_path__, replacement: '/api/v1/nodes/$1/proxy/metrics/cadvisor'}
          - {source_labels: [__meta_kubernetes_node_name], target_label: node}

  alerts.yml: |
    groups:
      - name: abrl
        rules:
          - alert: ABRLApiUnavailable
            expr: up{job="abrl-fleet"} == 0
            for: 1m
            labels: {severity: critical}
            annotations: {summary: ABRL fleet metrics unavailable}
          - alert: ABRLQueueDelay
            expr: abrl_session_queue_oldest_seconds > 120
            for: 2m
            labels: {severity: warning}
            annotations: {summary: Admitted browser work delayed}
          - alert: ABRLPostgresReplicationLag
            expr: cnpg_pg_replication_lag > 30
            for: 1m
            labels: {severity: critical}
            annotations: {summary: PostgreSQL standby replication is delayed}
          - alert: ABRLProfileQuarantined
            expr: abrl_profiles_quarantined > 0
            for: 1m
            labels: {severity: critical}
            annotations: {summary: Persistent profile requires runtime fencing verification}
  otel.yaml: |
    receivers:
      otlp:
        protocols:
          http: {endpoint: 0.0.0.0:4318}
    processors:
      memory_limiter: {check_interval: 1s, limit_mib: 384}
      batch: {}
    exporters:
      {{- if .Values.observability.traceEndpoint }}
      otlphttp: {endpoint: {{ .Values.observability.traceEndpoint | quote }}}
      {{- else }}
      debug: {verbosity: basic}
      {{- end }}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [{{ if .Values.observability.traceEndpoint }}otlphttp{{ else }}debug{{ end }}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: abrl-prometheus}
spec:
  serviceName: abrl-prometheus
  replicas: 2
  selector: {matchLabels: {app: abrl-prometheus}}
  template:
    metadata: {labels: {app: abrl-prometheus, abrl.io/role: observability}}
    spec:
      {{- include "abrl.applicationNode" . | nindent 6 }}
      {{- include "abrl.spread" "abrl-prometheus" | nindent 6 }}
      serviceAccountName: abrl-observability
      automountServiceAccountToken: true
      securityContext: {runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534}
      containers:
        - name: prometheus
          image: {{ .Values.observability.prometheusImage }}
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=30d]
          ports: [{name: http, containerPort: 9090}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          volumeMounts: [{name: config, mountPath: /etc/prometheus}, {name: token, mountPath: /etc/metrics, readOnly: true}, {name: data, mountPath: /prometheus}]
      volumes:
        - {name: config, configMap: {name: abrl-observability}}
        - {name: token, secret: {secretName: {{ .Values.metricsSecret }}}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], storageClassName: {{ .Values.storageClass }}, resources: {requests: {storage: 20Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: abrl-prometheus}
spec: {selector: {app: abrl-prometheus}, ports: [{port: 9090, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: abrl-otel}
spec:
  replicas: 2
  selector: {matchLabels: {app: abrl-otel}}
  template:
    metadata: {labels: {app: abrl-otel, abrl.io/role: observability}}
    spec:
      {{- include "abrl.applicationNode" . | nindent 6 }}
      {{- include "abrl.spread" "abrl-otel" | nindent 6 }}
      automountServiceAccountToken: false
      containers:
        - name: otel
          image: {{ .Values.observability.otelImage }}
          args: [--config=/etc/otel/otel.yaml]
          ports: [{name: otlp, containerPort: 4318}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          volumeMounts: [{name: config, mountPath: /etc/otel}]
      volumes: [{name: config, configMap: {name: abrl-observability}}]
---
apiVersion: v1
kind: Service
metadata: {name: abrl-otel}
spec: {selector: {app: abrl-otel}, ports: [{port: 4318, targetPort: otlp}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: observability-ingress}
spec:
  podSelector: {matchLabels: {abrl.io/role: observability}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchExpressions: [{key: abrl.io/role, operator: In, values: [control, runner, observability]}]}}]
      ports: [{port: 4318}, {port: 9090}]
{{- end }}
