apiVersion: v1
kind: ConfigMap
metadata: {name: abrl-redis-config}
data:
  start-redis.sh: |
    #!/bin/sh
    set -eu
    master=abrl-redis-0.abrl-redis
    found=false
    for peer in 0 1 2; do
      address=$(REDISCLI_AUTH="$REDIS_PASSWORD" timeout 3 redis-cli --no-auth-warning -h "abrl-redis-$peer.abrl-redis" -p 26379 --raw SENTINEL get-master-addr-by-name abrl-master 2>/dev/null | head -1) || true
      if [ -n "$address" ]; then master="$address"; found=true; break; fi
    done
    if [ -f /data/initialized ] && [ "$found" = false ]; then
      echo 'Waiting for a Sentinel before restarting previously initialized Redis' >&2
      sleep 10
      exit 1
    fi
    self=$(hostname -i | awk '{print $1}')
    master_ip=$(getent hosts "$master" | awk '{print $1}' | head -1)
    umask 077
    printf 'bind 0.0.0.0\nprotected-mode yes\nport 6379\ndir /data\nappendonly yes\nappendfsync everysec\nrequirepass %s\nmasterauth %s\n' "$REDIS_PASSWORD" "$REDIS_PASSWORD" > /data/redis.conf
    if [ "$master_ip" != "$self" ]; then printf 'replicaof %s 6379\n' "$master" >> /data/redis.conf; fi
    touch /data/initialized
    exec redis-server /data/redis.conf
  start-sentinel.sh: |
    #!/bin/sh
    set -eu
    umask 077
    if [ ! -f /sentinel/sentinel.conf ]; then
      printf 'port 26379\nbind 0.0.0.0\nprotected-mode yes\nrequirepass %s\nsentinel resolve-hostnames yes\nsentinel announce-hostnames yes\nsentinel monitor abrl-master abrl-redis-0.abrl-redis 6379 2\nsentinel auth-pass abrl-master %s\nsentinel down-after-milliseconds abrl-master 10000\nsentinel failover-timeout abrl-master 60000\nsentinel parallel-syncs abrl-master 1\n' "$REDIS_PASSWORD" "$REDIS_PASSWORD" > /sentinel/sentinel.conf
    fi
    exec redis-server /sentinel/sentinel.conf --sentinel
---
apiVersion: v1
kind: Service
metadata: {name: abrl-redis}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: abrl-redis}
  ports: [{name: redis, port: 6379}, {name: sentinel, port: 26379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: abrl-redis}
spec:
  serviceName: abrl-redis
  replicas: 3
  podManagementPolicy: Parallel
  selector: {matchLabels: {app: abrl-redis}}
  template:
    metadata: {labels: {app: abrl-redis, abrl.io/role: data}}
    spec:
      {{- include "abrl.dataNode" . | nindent 6 }}
      automountServiceAccountToken: false
      securityContext: {runAsUser: 999, runAsGroup: 999, fsGroup: 999}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: abrl-redis}}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          command: [sh, /scripts/start-redis.sh]
          env: [{name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: abrl-data, key: redis-password}}}]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe:
            exec: {command: [sh, -c, 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --no-auth-warning ping | grep -q PONG']}
            periodSeconds: 5
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          volumeMounts: [{name: scripts, mountPath: /scripts}, {name: data, mountPath: /data}]
        - name: sentinel
          image: {{ .Values.redis.image }}
          command: [sh, /scripts/start-sentinel.sh]
          env: [{name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: abrl-data, key: redis-password}}}]
          ports: [{name: sentinel, containerPort: 26379}]
          resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          volumeMounts: [{name: scripts, mountPath: /scripts}, {name: sentinel, mountPath: /sentinel}]
      volumes: [{name: scripts, configMap: {name: abrl-redis-config, defaultMode: 0555}}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], storageClassName: {{ .Values.storageClass }}, resources: {requests: {storage: {{ .Values.redis.size }}}}}
    - metadata: {name: sentinel}
      spec: {accessModes: [ReadWriteOnce], storageClassName: {{ .Values.storageClass }}, resources: {requests: {storage: 1Gi}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: abrl-redis}
spec: {minAvailable: 2, selector: {matchLabels: {app: abrl-redis}}}
