imagePullSecrets: []
application:
  enabled: true
image:
  repository: abrl
  tag: local
  digest: ""
  pullPolicy: IfNotPresent
webImage:
  repository: abrl-web
  tag: local
  digest: ""
host: abrl.example.invalid
tlsSecret: abrl-tls
runtimeSecret: abrl-runtime
metricsSecret: abrl-metrics
storageClass: hcloud-volumes
apiReplicas: 2
schedulerReplicas: 2
maximumSessions: 500
# Include API endpoint IPs for CNIs that evaluate NetworkPolicy after Service DNAT.
controlPlaneCidrs: [10.20.0.10/32, 10.20.0.11/32, 10.20.0.12/32]
cloudWorkers:
  # Enable only after the separate browser/broker boundary has been verified.
  enabled: false
  isolationAttestation: ""
  standardMax: 500
  vendorEnabled: false
  objectStorageCidrs: []
  browserImage: abrl-browser:local
  manualImage: ""
  cloakImage: ""
  kameleoImage: ""
  kameleoEngineImage: ""
  kameleoControlOrigins: []
  vendorMax: 500
  activeDeadlineSeconds: 14400
  pools:
    standard: {cpu: "2", memory: 4Gi}
    vendor: {cpu: "4", memory: 8Gi}
autoscaler:
  enabled: false
  image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.35.3
  networkId: ""
  standard: {min: 2, max: 30, type: ccx63, location: fsn1}
  vendor: {min: 0, max: 50, type: ccx63, location: fsn1}
postgres:
  image: ghcr.io/cloudnative-pg/postgresql:16.13
  size: 200Gi
  backupsEnabled: false
  backupEndpoint: ""
  backupDestination: ""
redis:
  image: redis:7.4.8-alpine
  size: 20Gi
clickhouse:
  image: clickhouse/clickhouse-server:25.8.18.1
  keeperImage: clickhouse/clickhouse-keeper:25.8.18.1
  size: 200Gi
observability:
  enabled: true
  prometheusImage: prom/prometheus:v3.5.1
  otelImage: otel/opentelemetry-collector-contrib:0.145.0
  # Set to a private authenticated trace backend; data must not leave by default.
  traceEndpoint: ""

backupMirror:
  enabled: false
  secret: abrl-backup-mirror
  sourceBuckets: [abrl-profiles, abrl-reports]
  destinationBucket: abrl-dr-encrypted
  nativeSseBuckets: []
  nativePrefix: backups/
  nativeWalPrefix: backups/abrl-postgres/wals/

verifier:
  enabled: false
  image: abrl-verifier:local
  secret: abrl-adscore-verifier
